<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<!-- Only this file's own script and styles run; it may fetch the shared page's JSON from a Supabase project and show
     pictures given inline (data:). The page itself is shown in a sandboxed frame that can run nothing. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://*.supabase.co; frame-src 'self' about: data:; base-uri 'none'; form-action 'none'">
<title>Shared page</title>
<style>
  /* The public viewer of layr Wiki pages: one static file (host it anywhere, e.g. GitHub Pages). Opened as
     <this address>#<supabase project ref>/<user id>/<slug>, it reads <ref>.supabase.co/storage/v1/object/public/
     lf-wiki-shares/<user id>/<slug>.json and shows the page. */
  :root { --bg: #ffffff; --bg-2: #f6f7f9; --fg: #1d2026; --fg-dim: #626a76; --border: #dadde3; --accent: #3b6fd8;
    color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) { --bg: #17191d; --bg-2: #1f2227; --fg: #e5e7eb; --fg-dim: #9aa1ac; --border: #343941;
      --accent: #7aa2f7; color-scheme: dark; }
  }
  :root.dark { --bg: #17191d; --bg-2: #1f2227; --fg: #e5e7eb; --fg-dim: #9aa1ac; --border: #343941; --accent: #7aa2f7;
    color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 16px/1.6 -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); }
  header .mark { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; }
  header .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .spacer { flex: 1; }
  header button { font: inherit; font-size: 13px; color: var(--fg); background: var(--bg-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  header button:hover { border-color: var(--accent); }
  main { flex: 1; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 4px; }
  iframe { display: block; width: 100%; border: 0; min-height: 60vh; background: transparent; }
  .state { max-width: 520px; margin: 18vh auto 0; padding: 0 20px; text-align: center; color: var(--fg-dim); }
  .state h1 { color: var(--fg); font-size: 1.3em; margin: 0 0 8px; }
  .spinner { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid var(--border);
    border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { color: var(--fg-dim); font-size: 12px; text-align: center; padding: 18px 16px 26px; }
  @media print { header, footer { display: none; } }
</style>
</head>
<body>
<header>
  <div class="mark" aria-hidden="true">W</div>
  <div class="name" id="name">Shared page</div>
  <div class="spacer"></div>
  <button id="theme" type="button" title="Light or dark">Dark</button>
</header>
<main id="main"><div class="state"><div class="spinner"></div>Loading…</div></main>
<footer id="foot">A read-only page shared from a layr Wiki.</footer>
<script>
"use strict";
(function () {
  var main = document.getElementById("main");
  var root = document.documentElement;
  var themeButton = document.getElementById("theme");
  var frame = null;

  // ---------- light and dark ----------
  function dark() {
    if (root.classList.contains("dark")) return true;
    if (root.classList.contains("light")) return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function applyTheme() {
    themeButton.textContent = dark() ? "Light" : "Dark";
    if (frame && frame.contentDocument) {
      frame.contentDocument.documentElement.className = dark() ? "dark" : "light";
    }
  }
  var saved = null;
  try { saved = localStorage.getItem("wiki-share-theme"); } catch (e) { /* storage blocked */ }
  if (saved === "dark" || saved === "light") root.classList.add(saved);
  themeButton.addEventListener("click", function () {
    var next = dark() ? "light" : "dark";
    root.classList.remove("dark", "light");
    root.classList.add(next);
    try { localStorage.setItem("wiki-share-theme", next); } catch (e) { /* storage blocked */ }
    applyTheme();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
  applyTheme();

  function show(title, text) {
    var box = document.createElement("div");
    box.className = "state";
    var h = document.createElement("h1");
    h.textContent = title;
    var p = document.createElement("p");
    p.textContent = text;
    box.append(h, p);
    main.replaceChildren(box);
  }

  // ---------- where the page is ----------
  // #<project ref>/<user id>/<slug>: each part checked, so the address can only ever point into the public bucket.
  var m = /^#?([a-z0-9]{6,40})\/([0-9a-f-]{36})\/([A-Za-z0-9_-]{16,64})$/i.exec(decodeURIComponent(location.hash || ""));
  if (!m) {
    show("No page in this link", "The link is incomplete. Ask the person who shared it for the whole link.");
    return;
  }
  var url = "https://" + m[1].toLowerCase() + ".supabase.co/storage/v1/object/public/lf-wiki-shares/" +
    m[2].toLowerCase() + "/" + m[3] + ".json";

  // ---------- the shared HTML, treated as untrusted ----------
  var ALLOWED = /^(a|abbr|article|b|blockquote|br|caption|code|col|colgroup|dd|del|details|div|dl|dt|em|figcaption|figure|h[1-6]|hr|i|img|input|kbd|li|mark|ol|p|pre|q|s|section|small|span|strong|sub|summary|sup|table|tbody|td|tfoot|th|thead|tr|u|ul)$/i;
  var ATTRS = /^(class|id|title|alt|href|src|width|height|colspan|rowspan|style|type|checked|disabled|start|open|align|data-[a-z-]+)$/i;
  function clean(html, images) {
    var doc = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html");
    var all = doc.body.querySelectorAll("*");
    for (var i = all.length - 1; i >= 0; i--) {
      var el = all[i];
      if (!ALLOWED.test(el.tagName)) {
        // Unknown elements go; harmless containers keep their text.
        if (/^(script|style|iframe|object|embed|link|meta|base|form|svg|math|template|noscript|frame|frameset)$/i.test(el.tagName)) el.remove();
        else el.replaceWith.apply(el, Array.prototype.slice.call(el.childNodes));
        continue;
      }
      for (var j = el.attributes.length - 1; j >= 0; j--) {
        var a = el.attributes[j];
        var v = a.value;
        if (!ATTRS.test(a.name)) el.removeAttribute(a.name);
        else if (a.name === "href" && !/^(https?:|mailto:|#)/i.test(v)) el.removeAttribute(a.name);
        else if (a.name === "src" && !/^data:image\/(png|jpe?g|gif|webp|avif|bmp);/i.test(v)) el.removeAttribute(a.name);
        else if (a.name === "style" && /url\(|expression|@import|javascript:/i.test(v)) el.removeAttribute(a.name);
      }
      if (el.tagName === "INPUT") {
        if ((el.getAttribute("type") || "").toLowerCase() !== "checkbox") { el.remove(); continue; }
        el.setAttribute("disabled", "");
      }
      if (el.tagName === "IMG" && !el.getAttribute("src")) {
        var name = el.getAttribute("data-file");
        var pic = name && images && images[name];
        if (pic && /^data:image\/(png|jpe?g|gif|webp|avif|bmp);/i.test(pic)) el.setAttribute("src", pic);
      }
      if (el.tagName === "A" && /^https?:/i.test(el.getAttribute("href") || "")) {
        el.setAttribute("target", "_blank");
        el.setAttribute("rel", "noopener noreferrer");
      }
    }
    return doc.body.innerHTML;
  }

  function fit() {
    if (!frame || !frame.contentDocument) return;
    frame.style.height = frame.contentDocument.documentElement.scrollHeight + "px";
  }

  function render(data) {
    var title = String(data.title || "Shared page");
    document.title = title;
    document.getElementById("name").textContent = title;
    var css = String(data.css || "").replace(/<\/style/gi, "");
    var body = clean(String(data.html || ""), data.images || {});
    var h1 = document.createElement("h1");
    h1.className = "page-title";
    h1.textContent = title;
    var updated = Number(data.updated) ? new Date(Number(data.updated)) : null;
    var meta = updated ? "<p class=\"page-meta\">Last changed " + updated.toLocaleDateString(undefined,
      { year: "numeric", month: "long", day: "numeric" }) + "</p>" : "";
    // The frame's own policy as well: no scripts, no outside loads, even if something slipped through.
    var srcdoc = "<!doctype html><html class=\"" + (dark() ? "dark" : "light") + "\"><head><meta charset=\"utf-8\">" +
      "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src data:\">" +
      "<base target=\"_blank\"><style>" + css + " html,body{background:transparent} .wiki-export{padding-top:20px}</style>" +
      "</head><body><main class=\"wiki-export\"><article>" + h1.outerHTML + meta + body + "</article></main></body></html>";
    frame = document.createElement("iframe");
    frame.title = title;
    // allow-same-origin without allow-scripts: nothing in it runs, and this page can size it and follow its links.
    frame.setAttribute("sandbox", "allow-same-origin allow-popups allow-popups-to-escape-sandbox");
    frame.setAttribute("referrerpolicy", "no-referrer");
    frame.addEventListener("load", function () {
      var d = frame.contentDocument;
      if (!d) return;
      fit();
      d.addEventListener("click", function (e) {
        var a = e.target.closest && e.target.closest("a[href^='#']");
        if (!a) return;
        e.preventDefault();
        var target = d.getElementById(a.getAttribute("href").slice(1));
        if (target) window.scrollTo({ top: frame.getBoundingClientRect().top + window.scrollY + target.offsetTop - 64,
          behavior: "smooth" });
      });
      Array.prototype.forEach.call(d.images, function (img) { img.addEventListener("load", fit); });
      if (window.ResizeObserver) new ResizeObserver(fit).observe(d.body);
    });
    frame.srcdoc = srcdoc;
    main.replaceChildren(frame);
    window.addEventListener("resize", fit);
  }

  fetch(url, { credentials: "omit", referrerPolicy: "no-referrer", cache: "no-cache" })
    .then(function (res) {
      if (res.status === 400 || res.status === 404) throw new Error("gone");
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      if (!data || typeof data !== "object" || data.v !== 1) throw new Error("format");
      render(data);
    })
    .catch(function (error) {
      if (String(error.message) === "gone") {
        show("This page isn't shared any more", "Its owner stopped sharing it, or the link is wrong.");
      } else if (String(error.message) === "format") {
        show("Can't show this page", "It was made by a newer version of the wiki. Update this viewer page.");
      } else {
        show("Couldn't load the page", "Check your connection and try again. (" + error.message + ")");
      }
    });
})();
</script>
</body>
</html>
